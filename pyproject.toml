[project]
name = "musicbox"
version = "0.1.0"
description = "A home server that lets an old iPad play YouTube music without ads"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
